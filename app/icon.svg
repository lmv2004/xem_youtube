<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="xp-favicon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F111A" />
      <stop offset="100%" stop-color="#05060A" />
    </linearGradient>
    <linearGradient id="xp-favicon-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F2FE" />
    </linearGradient>
    <linearGradient id="xp-favicon-play1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF416C" />
      <stop offset="100%" stop-color="#FF4B2B" />
    </linearGradient>
    <linearGradient id="xp-favicon-play2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>
    <linearGradient id="xp-favicon-play3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="100%" stop-color="#4FACFE" />
    </linearGradient>
    <filter id="xp-favicon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="2" y="2" width="44" height="44" rx="13" fill="url(#xp-favicon-bg)" />
  <rect x="2.5" y="2.5" width="43" height="43" rx="12.5" stroke="url(#xp-favicon-border)" stroke-width="1.8" stroke-opacity="0.9" />

  <!-- Ambient Glow Behind Play Glyph -->
  <circle cx="24" cy="24" r="12" fill="#FF3366" opacity="0.3" filter="url(#xp-favicon-glow)" />

  <!-- Modern 3D Prism Play Glyph -->
  <!-- Top facet -->
  <path d="M19 14.5 L33 24 L24 24 Z" fill="url(#xp-favicon-play1)" />
  <!-- Bottom facet -->
  <path d="M19 14.5 L24 24 L19 33.5 Z" fill="url(#xp-favicon-play2)" />
  <!-- Center-right facet -->
  <path d="M19 33.5 L24 24 L33 24 Z" fill="url(#xp-favicon-play3)" />

  <!-- Sheen Line -->
  <path d="M19 14.5 L33 24" stroke="white" stroke-width="1.2" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Lens Flare Sparkle -->
  <path d="M34 11 C34 12.5 35.5 14 37 14 C35.5 14 34 15.5 34 17 C34 15.5 32.5 14 31 14 C32.5 14 34 12.5 34 11 Z" fill="#FFFFFF" opacity="0.95" />
</svg>
